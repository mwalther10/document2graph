[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-graph"
version = "0.1.0"
description = "Extract hierarchical document graphs and baseline chunks from PDF"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Marina Walther", email = "marina.walther@gmail.com"}]
requires-python = ">=3.11"
keywords = ["pdf", "document-graph", "docling", "networkx", "chunking", "retrieval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "docling",
    "docling-core",
    "docling-parse",
    "numpy",
    "pydantic>=2",
    "regex",
    "networkx",
    "coloredlogs",
    "tqdm",
    "transformers",
]

[project.urls]
Homepage = "https://github.com/mwalther10/document-graph"
Issues = "https://github.com/mwalther10/document-graph/issues"

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["."]
include = ["document_graph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: tests that download models or do heavy processing (skip with -m 'not slow')",
]
